name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'campus-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: campus-frontend/package-lock.json

      - run: npm ci

      - run: npx ng build --configuration production,ghpages

      # GitHub Pages has no server-side routing — serving index.html for any
      # unmatched path lets the Angular router take over client-side.
      - run: cp dist/campus-frontend/browser/index.html dist/campus-frontend/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: campus-frontend/dist/campus-frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
