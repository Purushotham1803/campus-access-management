<div class="login-page">
  <div class="login-left">
    <div class="hero-content">
      <mat-icon class="hero-icon">school</mat-icon>
      <h1>Campus Access Management</h1>
      <p>Secure, smart, and seamless campus gate management for students and faculty.</p>
    </div>
  </div>

  <div class="login-right">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Sign In</mat-card-title>
        <mat-card-subtitle>Enter your campus credentials</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div class="error-msg" [class.retrying-msg]="retrying" *ngIf="error">
          <mat-spinner *ngIf="retrying" diameter="16"></mat-spinner>
          <mat-icon *ngIf="!retrying">error_outline</mat-icon>
          <span>{{error}}<ng-container *ngIf="retrying"> Retrying in {{retryCountdown}}s&hellip;</ng-container></span>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput [(ngModel)]="username" placeholder="Enter username" (keyup.enter)="login()"/>
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="password" (keyup.enter)="login()"/>
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="primary" class="login-btn" (click)="login()" [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">Sign In</span>
        </button>
      </mat-card-content>
    </mat-card>
  </div>
</div>
